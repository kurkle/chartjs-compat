name: PR CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  shared-ci:
    uses: kurkle/configs/.github/workflows/shared-ci.yml@v1
    with:
      fetch-depth: 1
      install-command: npm clean-install --ignore-scripts && npx playwright install chromium firefox
      coverage-paths: |
        coverage/browser/lcov.info
      # Playwright's browsers are headless; the shared xvfb wrapper is not needed.
      browser-tests: false
      run-audit-signatures: false
      # No SonarCloud project yet.
      run-sonar: false

  compressed-size:
    runs-on: ubuntu-latest
    needs: [shared-ci]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Compressed size
        uses: preactjs/compressed-size-action@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: "./dist/*.{js,cjs}"
          build-script: "npm run build"
          install-script: "npm ci --ignore-scripts"
