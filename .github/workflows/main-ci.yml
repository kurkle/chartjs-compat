name: Main CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared-ci:
    uses: kurkle/configs/.github/workflows/shared-ci.yml@v1
    with:
      fetch-depth: 0
      install-command: npm clean-install --ignore-scripts && npx playwright install chromium firefox
      coverage-paths: |
        coverage/browser/lcov.info
      # Playwright's browsers are headless; the shared xvfb wrapper is not needed.
      browser-tests: false
      run-audit-signatures: true
      # No SonarCloud project yet.
      run-sonar: false

  # Releases are on hold until the package is published to npm for the first time; then add the
  # release job (semantic-release with npm trusted publishing, as in the other kurkle packages).
